  const imgs=x.images.length?x.images.map((f,i)=>`<img src="${esc(f)}" alt="${esc(x.cat)}参考图${i+1}" data-zoom>`).join(''):'<div style="padding:30px;color:#8892a3">暂无参考图</div>';
  return `<article class="card"><div class="card-head"><div class="task" data-copy="${esc(x.zp)}" title="点击复制商品编号">商品编号：${esc(x.zp)}</div></div><div class="gallery${x.images.length===1?' single':''}">${imgs}</div><div class="meta"><div class="label">类目上新路径</div><div class="category" data-copy="${esc(x.catpath)}" data-noreplace title="点击复制类目上新路径">${esc(x.catpath)}</div></div></article>`;
}
function render(){
  $('#groups').innerHTML=TABS.map(o=>{
    const data=ITEMS.filter(x=>x.op===o);
    const p0d=data.filter(x=>x.pri==='P0');
    const p1d=data.filter(x=>x.pri==='P1');
    const grp=(title,hi,list)=>list.length?`<div class="group-title">${title}${hi?`<span class="gt-hi">高优</span>`:''}<span class="gt-count">${list.length}款</span></div><div class="grid">${list.map(cardHTML).join('')}</div>`:'';
    return `<div data-op="${esc(o)}" style="display:${o===curTab?'block':'none'}">${grp('P0',true,p0d)}${grp('P1',false,p1d)}</div>`;
  }).join('');
}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab${t===curTab?' active':''}" data-t="${esc(t)}">${esc(t)}<span class="cnt">${ITEMS.filter(x=>x.op===t).length}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;renderTabs();render()});
}
let curImgSrc='';
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt)}return new Promise((res,rej)=>{try{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();res()}catch(e){rej(e)}})}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');
  if(z){curImgSrc=z.src;$('#modalImg').src=z.src;$('#modal').classList.add('open');return}
  const c=e.target.closest('[data-copy]');
  if(c){copyText(c.dataset.copy).then(()=>{if(c.hasAttribute('data-noreplace')){c.classList.add('copied');toast('已复制：'+c.dataset.copy);setTimeout(()=>c.classList.remove('copied'),1200)}else{const t=c.textContent;c.textContent='已复制 ✓';c.classList.add('copied');setTimeout(()=>{c.textContent=t;c.classList.remove('copied')},1200)}}).catch(()=>alert('复制失败，请手动复制'));}
});
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
$('#gsearch').onclick=e=>{e.stopPropagation();const abs=curImgSrc&&curImgSrc.startsWith('http')?curImgSrc:(location.origin&&location.origin!=='null'&&!location.origin.startsWith('file'))?location.origin+'/'+curImgSrc.replace(/^\.?\//,''):'';window.open(abs?'https://lens.google.com/uploadbyurl?url='+encodeURIComponent(abs):'https://lens.google.com/','_blank')};
renderTabs();render();
</script>
</body>
</html>
